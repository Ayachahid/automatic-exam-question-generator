[project]
name = "automatic-exam-question-generator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.13.0",
    "beautifulsoup4>=4.14.3",
    "dataclasses>=0.8",
    "datasets>=4.6.1",
    "fastapi>=0.135.1",
    "huggingface-hub>=1.6.0",
    "nltk>=3.9.3",
    "ollama>=0.6.1",
    "peft>=0.18.1",
    "pydantic>=2.12.5",
    "pymupdf>=1.27.2",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "python-multipart>=0.0.22",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "torch>=2.10.0",
    "transformers>=5.3.0",
    "uvicorn>=0.41.0",
    "streamlit>=1.55.0",
    "sentence-transformers>=5.3.0",
    "reportlab>=4.0.0",
    "chromadb>=0.5.0",
]

[dependency-groups]
dev = [
    "black>=26.3.0",
    "httpx>=0.28.1",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "jupyterlab>=4.5.5",
    "pytest>=9.0.2",
    "ruff>=0.15.5",
]

[tool.black]
target-version = ["py311"]
