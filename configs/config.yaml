model:
  provider: ollama
  name: qwen2.5:3b # qwen3:4b # qwen2.5:3b # llama3.2:1b 
  base_url: http://localhost:11434

chunker:
  strategy: fixed_size  # Options: fixed_size, sentence, semantic
  chunk_size: 2000
  overlap: 100
  # Semantic chunker parameters (used when strategy: semantic)
  model_name: all-MiniLM-L6-v2
  similarity_threshold: 0.75
  max_sentences: 8
  min_sentences: 3
  batch_size: 64

generation:
  question_type: short_answer
  difficulty: medium
  num_questions: 3